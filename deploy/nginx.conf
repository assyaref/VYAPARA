# nginx reverse proxy for VYAPARA sync (TLS). Drop into /etc/nginx/sites-available/ and ln -s to sites-enabled.
# Rate limit zones (define once in nginx.conf http block or here with limit_req_zone in server — use http{} in nginx.conf):
#   limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

server {
    listen 80;
    server_name sync.vyapara.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sync.vyapara.example.com;

    ssl_certificate     /etc/letsencrypt/live/sync.vyapara.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.vyapara.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1m;   # sync server enforces 1MB bodies

    # Rate limit the owner dashboard and enrollment endpoints
    limit_req zone=admin burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
